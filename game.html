canvas{

#timer{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:50px;
    font-weight:bold;
    text-shadow:
    0 0 10px black;
    z-index:10;
}
/* クイズ風の正解・不正解エフェクト用 */
#overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none; /* クリックを阻害しない */
    z-index: 20;
    opacity: 0;
    transition: opacity 0.2s ease;
}
#overlay img {
    width: 300px; /* 画像のサイズ */
    height: 300px;
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timer = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const resultImg = document.getElementById("result-img");

let currentAnswer = null;
let isCorrect = false;      // 正解フラグ
let isAnimating = false;    // 演出中フラグ

// 正解されたら即座に終了する拡張wait関数
function wait(ms){
    return new Promise(resolve => {
        const timeout = setTimeout(() => {
            clearInterval(checkInterval);
            resolve();
        }, ms);
        
        const checkInterval = setInterval(() => {
            if (isCorrect) {
                clearTimeout(timeout);
                clearInterval(checkInterval);
                resolve();
            }
        }, 30);
    });
}

function loadImage(src){
    return new Promise(resolve=>{
        const img = new Image();
        img.onload = ()=>{
            resolve(img);
        };
        img.src = src;
    });
}

function drawImage(img){
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
    ctx.globalAlpha = 1;
    ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );
}

// 〇×演出を1秒間表示する関数
function showResultEffect(isMaru) {
    return new Promise(resolve => {
        isAnimating = true;
        resultImg.src = isMaru ? "UIimages/maru.png" : "UIimages/batsu.png";
        
        // フェードイン
        overlay.style.opacity = "1";
        
        // 1秒後にフェードアウト
        setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                isAnimating = false;
                resolve();
            }, 200); // CSSのtransition（0.2s）を待つ
        }, 300);
    });
}

async function playSeries(data){
    currentAnswer = data.answer;
    isCorrect = false; // シリーズ開始時に初期化
    let remain = data.time;
    let timeUp = false;
    timer.textContent = remain;
    
    const timerID = setInterval(()=>{
        if(isCorrect) {
            clearInterval(timerID);
            return;
        }
        remain--;
        timer.textContent = remain;
        if(remain <= 0){
            timeUp = true;
            clearInterval(timerID);
        }
    },1000);

    let current = await loadImage(
        data.images[0]
    );
    drawImage(current);
    await wait(2000);
    
    for(let i=1;i<data.images.length;i++){
        if(timeUp || isCorrect){
            break;
        }
        let next = await loadImage(
            data.images[i]
        );
        for(let a=0;a<=100;a++){
            if(isCorrect) break;
            
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.globalAlpha = 1;
            ctx.drawImage(
                current,
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.globalAlpha = a/100;
            ctx.drawImage(
                next,
                0,
                0,
                canvas.width,
                canvas.height
            );
            await wait(30);
        }
        current = next;
        await wait(2000);
    }
    clearInterval(timerID);
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

async function startGame(){
    shuffleArray(series);
    const selectedSeries=series.slice(0,10);
    for(const data of selectedSeries){
        await playSeries(data);
    }
    timer.textContent="終了";
    currentAnswer = null;
}

canvas.addEventListener("click", async (e)=>{
    if(!currentAnswer || isCorrect || isAnimating){
        return;
    }
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if(
        x >= currentAnswer.x &&
        x <= currentAnswer.x + currentAnswer.width &&
        y >= currentAnswer.y &&
        y <= currentAnswer.y + currentAnswer.height
    ){
        isCorrect = true;
        await showResultEffect(true);  // 〇演出
    }else{
        await showResultEffect(false); // ×演出
    }
});

startGame();
