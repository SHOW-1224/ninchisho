<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ▼ スマホやタブレットで画面が勝手に縮小・拡大されないようにする必須設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>間違い探し</title>
<style>
body{
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
}
#game{
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9; /* ▼ 常に16:9の綺麗な比率を維持する */
    display: flex;
    justify-content: center;
    align-items: center;
}
canvas{
    width: 100%;
    height: 100%;
    object-fit: contain; /* ▼ 比率を崩さずに画面内に収める */
    display: block;
}
#timer{
    position: absolute;
    top: 3%;
    left: 3%;
    color: white;
    font-size: clamp(24px, 4vw, 50px);
    font-weight: bold;
    text-shadow: 0 0 10px black;
    z-index: 10;
    line-height: 1.2;
}
/* クイズ風の正解・不正解エフェクト用 */
#overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none; /* クリックを阻害しない */
    z-index: 20;
    opacity: 0;
    transition: opacity 0.2s ease;
}
#overlay img {
    width: clamp(150px, 30vw, 300px); /* ▼ スマホでも大きすぎないよう可変に */
    height: clamp(150px, 30vw, 300px);
}
</style>
</head>

    <div id="timer">80</div>
    <!-- 〇×表示用のレイヤー -->

        ]

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timer = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const resultImg = document.getElementById("result-img");

// 効果音用の音声オブジェクトを作成
const correctSound = new Audio("sounds/correct.mp3");
const incorrectSound = new Audio("sounds/incorrect.mp3");

// ブラウザの設定から音声設定を取得
const audioSetting = localStorage.getItem("audioSetting") || "on";
const isAudioOn = (audioSetting === "on");

let currentAnswer = null;
let isCorrect = false;      // 正解フラグ
let isAnimating = false;    // 演出中フラグ
let scoreTimes = [];        // 正解にかかった時間を保存する配列
let isGameOver = false;     // ゲーム終了フラグ

// 正解されたら即座に終了する拡張wait関数
function wait(ms){
    return new Promise(resolve => {
        const timeout = setTimeout(() => {
            clearInterval(checkInterval);
            resolve();
        }, ms);
        
        const checkInterval = setInterval(() => {
            if (isCorrect) {
                clearTimeout(timeout);
                clearInterval(checkInterval);
                resolve();
            }
        }, 30);
    });
}

function loadImage(src){
    return new Promise(resolve=>{
        const img = new Image();
        img.onload = ()=>{
            resolve(img);
        };
        img.src = src;
    });
}

function drawImage(img){
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
    ctx.globalAlpha = 1;
    ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );
}

// 〇×演出と音声再生を行う関数
function showResultEffect(isMaru) {
    return new Promise(resolve => {
        isAnimating = true;
        resultImg.src = isMaru ? "UIimages/maru.png" : "UIimages/batsu.png";
        
        if (isAudioOn) {
            const sound = isMaru ? correctSound : incorrectSound;
            sound.currentTime = 0;
            sound.play().catch(e => console.log("音声再生エラー:", e));
        }

        overlay.style.opacity = "1";
        
        setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                isAnimating = false;
                resolve();
            }, 200); 
        }, 300);
    });
}

async function playSeries(data){
    currentAnswer = data.answer;
    isCorrect = false; 
    let remain = data.time;
    let timeUp = false;
    timer.textContent = remain;
    
    const startTime = Date.now(); 

    const timerID = setInterval(()=>{
        if(isCorrect) {
            clearInterval(timerID);
            return;
        }
        remain--;
        timer.textContent = remain;
        if(remain <= 0){
            timeUp = true;
            clearInterval(timerID);
        }
    },1000);

    let current = await loadImage(
        data.images[0]
    );
    drawImage(current);
    await wait(2000);
    
    for(let i=1; i<data.images.length; i++){
        if(timeUp || isCorrect){
            break;
        }
        let next = await loadImage(
            data.images[i]
        );
        for(let a=0; a<=100; a++){
            if(isCorrect) break;
            
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.globalAlpha = 1;
            ctx.drawImage(
                current,
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.globalAlpha = a/100;
            ctx.drawImage(
                next,
                0,
                0,
                canvas.width,
                canvas.height
            );
            await wait(30);
        }
        current = next;
        await wait(2000);
    }
    clearInterval(timerID);

    if(isCorrect) {
        const elapsedTime = (Date.now() - startTime) / 1000;
        scoreTimes.push(elapsedTime);
    }
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

async function startGame(){
    scoreTimes = [];
    shuffleArray(series);
    const selectedSeries = series.slice(0, 10); 
    for(const data of selectedSeries){
        await playSeries(data);
    }

    if(scoreTimes.length > 0) {
        const totalTime = scoreTimes.reduce((sum, time) => sum + time, 0);
        const avgTime = totalTime / scoreTimes.length;
        
        let rank = "C";
        if(avgTime <= 30) {
            rank = "S";
        } else if(avgTime <= 35) {
            rank = "A";
        } else if(avgTime <= 45) {
            rank = "B";
        }
        
        timer.innerHTML = `終了！<br>平均: ${avgTime.toFixed(1)}秒<br>評価: ${rank}<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    } else {
        timer.innerHTML = `終了 (正解なし)<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    }

    currentAnswer = null;
    isGameOver = true; 
}

canvas.addEventListener("click", async (e)=>{
    if(isGameOver){
        window.location.href = "select.html";
        return;
    }
    if(!currentAnswer || isCorrect || isAnimating){
        return;
    }

    // ▼ スマホなどの表示サイズと内部の1280x720のズレを自動計算して正確な座標を算出
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    if(
        x >= currentAnswer.x &&
        x <= currentAnswer.x + currentAnswer.width &&
        y >= currentAnswer.y &&
        y <= currentAnswer.y + currentAnswer.height
    ){
        isCorrect = true;
        await showResultEffect(true);  // 〇演出
    }else{
        await showResultEffect(false); // ×演出
    }
});

startGame();
</script>
