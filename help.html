<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ▼ スマホやタブレットで画面が勝手に縮小・拡大されないようにする必須設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルール説明 - 脳トレ!!弘前観光</title>
<link rel="stylesheet" href="style5.css"> <!-- 共通のCSSファイルを読み込み -->
</head>
<body>

<div class="container">
    <div class="title">ルール説明</div>

    <div class="section help-content">
        <h2>遊び方</h2>
        <p>「脳トレ!!弘前観光」へようこそ！このゲームは、弘前市の観光名所のどこかが少しずつ変化していくので探しながら、弘前市の魅力を見つけ、脳トレを楽しむアプリです。</p>
        
        <h2>ゲームの流れ</h2>
        <ol>
            <li>ホーム画面から「難易度」ボタンを押します。</li>
            <li>「イージー」「ノーマル」「ハード」「ゆっくり」など、挑戦したい難易度を選択します。</li>
            <li>制限時間内に間違いの場所を見つけてタップします。</li>
            <li>10問終わったらタイムの平均を出し、それに応じたスコアが表示されます。</li>
        </ol>
    </div>

    <!-- ホームに戻るボタン -->
    <div class="section">
        <a class="btn" href="select.html">ホームに戻る</a>
    </div>
</div>

</body>
</html>
