<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>脳トレ!!弘前観光</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}

.container {
    text-align: center;
    animation: fadeIn 1s ease;
}

h1 {
    font-size: clamp(2.5rem, 8vw, 4rem);
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
}

p {
    font-size: 1.1rem;
    opacity: 0.8;
    margin: 0;
}

.fade-out {
    opacity: 0;
    transition: opacity 1.2s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container" id="box">
    <h1 id="text">HTHS</h1>
    <p>弘前観光 脳トレ間違い探し</p>
</div>

<script>
setTimeout(() => {
    document.getElementById("box").classList.add("fade-out");

    setTimeout(() => {
        window.location.href = "explain.html";
    }, 1200);

}, 2200);
</script>

</body>
</html>
