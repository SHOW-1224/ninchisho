const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timer = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const resultImg = document.getElementById("result-img");

const correctSound = new Audio("sounds/correct.mp3");
const incorrectSound = new Audio("sounds/incorrect.mp3");

const audioSetting = localStorage.getItem("audioSetting") || "on";
const isAudioOn = (audioSetting === "on");

let currentAnswer = null;
let isCorrect = false;
let isAnimating = false;
let scoreTimes = [];
let isGameOver = false;

// シンプルで安全な待機関数
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function loadImage(src){
    return new Promise(resolve=>{
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => {
            console.error("画像読み込みエラー: " + src);
            resolve(null);
        };
        img.src = src;
    });
}

function drawImage(img){
    if(!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

function showResultEffect(isMaru) {
    return new Promise(resolve => {
        isAnimating = true;
        resultImg.src = isMaru ? "UIimages/maru.png" : "UIimages/batsu.png";
        
        if (isAudioOn) {
            const sound = isMaru ? correctSound : incorrectSound;
            sound.currentTime = 0;
            sound.play().catch(e => console.log("音声再生エラー:", e));
        }

        overlay.style.opacity = "1";
        
        setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                isAnimating = false;
                resolve();
            }, 200);
        }, 300);
    });
}

async function playSeries(data){
    currentAnswer = data.answer;
    isCorrect = false;
    timer.textContent = "0.0秒";
    
    const startTime = Date.now();

    const timerID = setInterval(()=>{
        if(isCorrect || isGameOver) {
            clearInterval(timerID);
            return;
        }
        const currentElapsed = (Date.now() - startTime) / 1000;
        timer.textContent = currentElapsed.toFixed(1) + "秒";
    }, 100);

    let current = await loadImage(data.images[0]);
    if (!current) {
        clearInterval(timerID);
        return;
    }
    drawImage(current);
    
    for(let t=0; t<2000; t+=50) {
        if(isCorrect) break;
        await wait(50);
    }
    
    for(let i=1; i<data.images.length; i++){
        if(isCorrect) break;
        
        let next = await loadImage(data.images[i]);
        if (!next) continue;
        
        for(let a=0; a<=100; a+=2){
            if(isCorrect) break;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            ctx.drawImage(current, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = a/100;
            ctx.drawImage(next, 0, 0, canvas.width, canvas.height);
            await wait(25);
        }
        current = next;

        for(let t=0; t<2000; t+=50) {
            if(isCorrect) break;
            await wait(50);
        }
    }
    clearInterval(timerID);

    if(isCorrect) {
        const elapsedTime = (Date.now() - startTime) / 1000;
        scoreTimes.push(elapsedTime);
    }
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

async function startGame(){
    scoreTimes = [];
    shuffleArray(series);
    const selectedSeries = series.slice(0, 10);
    
    for(const data of selectedSeries){
        if(isGameOver) break;
        await playSeries(data);
    }

    if(scoreTimes.length > 0) {
        const totalTime = scoreTimes.reduce((sum, time) => sum + time, 0);
        const avgTime = totalTime / scoreTimes.length;
        
        let rank = "C";
        if(avgTime <= 10) {
            rank = "S";
        } else if(avgTime <= 25) {
            rank = "A";
        } else if(avgTime <= 40) {
            rank = "B";
        }
        
        timer.innerHTML = `終了！<br>平均: ${avgTime.toFixed(1)}秒<br>評価: ${rank}<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    } else {
        timer.innerHTML = `終了 (正解なし)<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    }

    currentAnswer = null;
    isGameOver = true;
}

canvas.addEventListener("click", async (e)=>{
    if(isGameOver){
        window.location.href = "select.html";
        return;
    }
    if(!currentAnswer || isCorrect || isAnimating){
        return;
    }
    
    // ▼ スマホなどの表示サイズと内部の1280x720のズレを自動計算して正確な座標を算出
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    if(
        x >= currentAnswer.x &&
        x <= currentAnswer.x + currentAnswer.width &&
        y >= currentAnswer.y &&
        y <= currentAnswer.y + currentAnswer.height
    ){
        isCorrect = true;
        await showResultEffect(true);
    }else{
        await showResultEffect(false);
    }
});

startGame();
