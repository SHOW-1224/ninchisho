body{
    margin: 0;

    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
}
#game{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
canvas{
    width: 100%;
    height: 100%;
    object-fit: contain; /* ▼ 比率を崩さずに画面全体に収める（余白は自動調整） */
    display: block;
}
#timer{
    position: absolute;
    top: 3%;
    left: 3%;
    color: white;
    font-size: clamp(24px, 4vw, 50px);
    font-weight: bold;
    text-shadow: 0 0 10px black;
    z-index: 10;
    line-height: 1.2;

/* 三本線メニューボタン */
#menu-btn {
    position: absolute;
    top: 3%;
    right: 3%;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    width: clamp(40px, 6vw, 60px);
    height: clamp(40px, 6vw, 60px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: clamp(4px, 0.8vw, 7px);
    cursor: pointer;
    z-index: 25;
    box-shadow: 0 0 5px black;
}
#menu-btn:active {
    background: rgba(255, 255, 255, 0.3);
}
/* 三本線のバー */
.menu-bar {
    width: 60%;
    height: 3px;
    background: white;
    border-radius: 2px;
}

/* モーダルメニュー */
#menu-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
#menu-modal.active {
    opacity: 1;
    pointer-events: auto;
}
.menu-content {
    background: #222;
    border: 3px solid white;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    color: white;
    width: 80%;
    max-width: 400px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.menu-content h2 {
    margin-top: 0;
    font-size: clamp(20px, 3vw, 28px);
}
.menu-btn-item {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.btn-toggle {
    background: #4CAF50;
    color: white;
}
.btn-toggle.off {
    background: #f44336;
}
.btn-exit {
    background: #555;
    color: white;
}
.btn-close {
    background: #ff9800;
    color: white;
}

/* クイズ風の正解・不正解エフェクト用 */
#overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none; /* クリックを阻害しない */
    z-index: 20;
    opacity: 0;
    transition: opacity 0.2s ease;
}
#overlay img {
    width: clamp(150px, 30vw, 300px);
    height: clamp(150px, 30vw, 300px);
}
</style>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timer = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const resultImg = document.getElementById("result-img");

const menuBtn = document.getElementById("menu-btn");
const menuModal = document.getElementById("menu-modal");

const exitBtn = document.getElementById("exit-btn");
const closeMenuBtn = document.getElementById("close-menu-btn");

const correctSound = new Audio("sounds/correct.mp3");
const incorrectSound = new Audio("sounds/incorrect.mp3");

let audioSetting = localStorage.getItem("audioSetting") || "on";
let isAudioOn = (audioSetting === "on");

// 音声ボタンの初期表示設定
function updateAudioButton() {
    if (isAudioOn) {
        audioToggleBtn.textContent = "音声: ON";
        audioToggleBtn.classList.remove("off");
    } else {
        audioToggleBtn.textContent = "音声: OFF";
        audioToggleBtn.classList.add("off");
    }
}
updateAudioButton();

let currentAnswer = null;
let isCorrect = false;
let isAnimating = false;
let scoreTimes = [];
let isGameOver = false;
let isPaused = false;

// シンプルで安全な待機関数
function wait(ms) {
    return new Promise(resolve => {
        const start = Date.now();
        const check = () => {
            if (isGameOver) {
                resolve();
                return;
            }
            if (isPaused) {
                setTimeout(check, 100);
                return;
            }
            const elapsed = Date.now() - start;
            if (elapsed >= ms) {
                resolve();
            } else {
                setTimeout(check, Math.min(50, ms - elapsed));
            }
        };
        setTimeout(check, Math.min(50, ms));
    });
}

function loadImage(src){
    return new Promise(resolve=>{
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => {
            console.error("画像読み込みエラー: " + src);
            resolve(null);
        };
        img.src = src;
    });
}

function drawImage(img){
    if(!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

function showResultEffect(isMaru) {
    return new Promise(resolve => {
        isAnimating = true;
        resultImg.src = isMaru ? "UIimages/maru.png" : "UIimages/batsu.png";
        
        if (isAudioOn) {
            const sound = isMaru ? correctSound : incorrectSound;
            sound.currentTime = 0;
            sound.play().catch(e => console.log("音声再生エラー:", e));
        }

        overlay.style.opacity = "1";
        
        setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                isAnimating = false;
                resolve();
            }, 200);
        }, 300);
    });
}

async function playSeries(data){
    currentAnswer = data.answer;
    isCorrect = false;
    timer.textContent = "0.0秒";
    
    const startTime = Date.now();
    let pausedTimeTotal = 0;

    const timerID = setInterval(()=>{
        if(isCorrect || isGameOver) {
            clearInterval(timerID);
            return;
        }
        if(isPaused) return;

        const currentElapsed = (Date.now() - startTime - pausedTimeTotal) / 1000;
        timer.textContent = currentElapsed.toFixed(1) + "秒";
    }, 100);

    let current = await loadImage(data.images[0]);
    if (!current) {
        clearInterval(timerID);
        return;
    }
    drawImage(current);
    
    for(let t=0; t<2000; t+=50) {
        if(isCorrect || isGameOver) break;
        await wait(50);
    }
    
    for(let i=1; i<data.images.length; i++){
        if(isCorrect || isGameOver) break;
        
        let next = await loadImage(data.images[i]);
        if (!next) continue;
        
        for(let a=0; a<=100; a+=2){
            if(isCorrect || isGameOver) break;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            ctx.drawImage(current, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = a/100;
            ctx.drawImage(next, 0, 0, canvas.width, canvas.height);
            await wait(25);
        }
        current = next;

        for(let t=0; t<2000; t+=50) {
            if(isCorrect || isGameOver) break;
            await wait(50);
        }
    }
    clearInterval(timerID);

    if(isCorrect) {
        const activeTime = (Date.now() - startTime - pausedTimeTotal) / 1000;
        scoreTimes.push(activeTime);
    }
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

async function startGame(){
    scoreTimes = [];
    shuffleArray(series);
    const selectedSeries = series.slice(0, 10);
    
    for(const data of selectedSeries){
        if(isGameOver) break;
        await playSeries(data);
    }

    if(isGameOver && scoreTimes.length === 0 && !isPaused) return;

    if(scoreTimes.length > 0) {
        const totalTime = scoreTimes.reduce((sum, time) => sum + time, 0);
        const avgTime = totalTime / scoreTimes.length;
        
        let rank = "C";
        if(avgTime <= 10) {
            rank = "S";
        } else if(avgTime <= 25) {
            rank = "A";
        } else if(avgTime <= 40) {
            rank = "B";
        }
        
        timer.innerHTML = `終了！<br>平均: ${avgTime.toFixed(1)}秒<br>評価: ${rank}<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    } else {
        timer.innerHTML = `終了 (正解なし)<br><span style="font-size:18px; color:#aaa;">(画面タップで選択画面へ戻る)</span>`;
        timer.style.fontSize = "clamp(20px, 3.5vw, 32px)";
    }

    currentAnswer = null;
    isGameOver = true;
    menuBtn.style.display = "none";
}

// --- メニュー操作に関するイベントリスナー ---
menuBtn.addEventListener("click", () => {
    if (isGameOver) return;
    isPaused = true;
    menuModal.classList.add("active");
});

closeMenuBtn.addEventListener("click", () => {
    menuModal.classList.remove("active");
    isPaused = false;
});

audioToggleBtn.addEventListener("click", () => {
    isAudioOn = !isAudioOn;
    localStorage.setItem("audioSetting", isAudioOn ? "on" : "off");
    updateAudioButton();
});

exitBtn.addEventListener("click", () => {
    window.location.href = "select.html";
});

// キャンバスをクリックした時の判定
canvas.addEventListener("click", async (e)=>{
    if(isGameOver){
        window.location.href = "select.html";
        return;
    }
    if(!currentAnswer || isCorrect || isAnimating || isPaused){
        return;
    }
    
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    if(
        x >= currentAnswer.x &&
        x <= currentAnswer.x + currentAnswer.width &&
        y >= currentAnswer.y &&
        y <= currentAnswer.y + currentAnswer.height
    ){
        isCorrect = true;
        await showResultEffect(true);
    }else{
        await showResultEffect(false);
    }
});

startGame();
</script>
</body>
